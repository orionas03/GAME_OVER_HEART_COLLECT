const HEART=['.##.##.','#######','#######','.#####.','..###..','...#...'];

const beep=(f,e,d,ty='square',v=.08)=>{if(!ctx)return;const t=ctx.currentTime,o=ctx.createOscillator(),a=ctx.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(e,t+d);a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(ctx.destination);o.start(t);o.stop(t+d)};
function heart(x,y,s,col,broken){
  g.fillStyle=col;
  HEART.forEach((r,j)=>[...r].forEach((c,i)=>{
    if(c!=='#')return;
    if(broken&&i===3)return;
    const off=broken?(i<3?-s*.4:s*.4):0;
    g.fillRect(Math.round(x+i*s+off),Math.round(y+j*s),s,s);
  }));
}

function nameText(){g.save();g.font='24px Pacifico,"Brush Script MT",cursive';g.textAlign='center';g.shadowColor='#000';g.shadowOffsetY=3;g.shadowBlur=8;g.fillStyle='#3a0540';g.fillText('Nephele ♡',W/2,H-28+2);g.shadowOffsetY=0;g.shadowColor='#ff2bb8';g.shadowBlur=14;g.fillStyle='#ff5fd0';g.fillText('Nephele ♡',W/2,H-28);g.restore()}
function begin(){
  if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended')ctx.resume();
  state='play';score=0;lives=3;items=[];lvl=1;spawn=0;beep(988,1319,.2);
}
function over(){
  state='over';overAt=performance.now();shake=14;
  beep(440,110,.35,'square',.1);setTimeout(()=>beep(220,55,.6,'square',.1),250);
  if(score>best){best=score;try{localStorage.setItem('goBest',best)}catch(e){}}
}
function update(dt){
  const sp=4.2*dt;
  if(keys.ArrowLeft||keys.a)px-=sp;if(keys.ArrowRight||keys.d)px+=sp;
  px=Math.max(34,Math.min(W-34,px));
  lvl=1+Math.floor(score/150);
  spawn-=dt;
  if(spawn<=0){
    spawn=Math.max(16,42-lvl*3)*(.7+Math.random()*.6);
    const r=Math.random(),bad=Math.min(.38,.2+lvl*.02);
    items.push({x:20+Math.random()*(W-40),y:-30,vy:1.8+lvl*.25+Math.random()*.8,t:r<bad?'b':r>.93?'s':'h',rot:0});
  }
  for(const it of items){
    it.y+=it.vy*dt;
    if(it.y>H-86&&it.y<H-56&&Math.abs(it.x-px)<42&&!it.done){
      it.done=1;
      if(it.t==='h'){score+=10;beep(660,990,.08)}
      else if(it.t==='s'){score+=50;beep(880,1760,.2,'triangle',.12)}
      else{lives--;shake=10;flash=1;beep(200,70,.25,'sawtooth',.12);if(lives<=0)over()}
    }
  }
  items=items.filter(i=>!i.done&&i.y<H+30);
  if(shake>0)shake-=dt;if(flash>0)flash-=.06*dt;
}
function draw(now){
  g.clearRect(0,0,W,H);g.save();
  if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  // HUD
  for(let i=0;i<3;i++)heart(14+i*22,16,3,i<lives?'#ff5fd0':'#4a2a5a');
  glowText('SCORE '+score,W-12,28,10,'#fff','right');
  glowText('BEST '+best,W-12,46,8,'#ff9be6','right');
  if(state!=='start'){glowText('LV '+lvl,14,56,8,'#ff9be6','left')}
  for(const it of items){
    if(it.t==='h')heart(it.x-10,it.y-9,4,'#ff5fd0');
    else if(it.t==='b')heart(it.x-10,it.y-9,4,'#8f3dff',true);
    else star(it.x-8,it.y-8,3);
  }
  if(state==='play'){
    // paddle = arcade joystick tray
    g.fillStyle='#ff5fd0';g.shadowColor='#ff2bb8';g.shadowBlur=14;g.fillRect(px-36,H-64,72,10);g.shadowBlur=0;
    g.fillStyle='#fff';g.fillRect(px-28,H-68,56,4);
    heart(px-7,H-82,2,'#fff');
  }
  const blink=Math.floor(now/450)%2===0;
  if(state==='start'){
    glowText('GAME',W/2,200,40);glowText('OVER',W/2,252,40);
    glowText('catch the hearts',W/2,320,10,'#ffd6f4');
    glowText('dodge the broken ones',W/2,344,10,'#ffd6f4');
    heart(W/2-35,372,5,'#ff5fd0');
    if(blink)glowText('TAP TO START',W/2,470,14,'#ff9be6');
    nameText();
  }
  if(state==='over'){
    g.fillStyle='rgba(16,3,28,.72)';g.fillRect(0,0,W,H);
    glowText('GAME',W/2,210,40);glowText('OVER',W/2,262,40);
    glowText('SCORE '+score,W/2,330,14,'#fff');
    glowText('BEST '+best,W/2,358,10,'#ff9be6');
    if(blink)glowText('INSERT COIN',W/2,430,13,'#ff9be6');
    if(blink)glowText('TO CONTINUE ♥',W/2,454,13,'#ff9be6');
    nameText();
  }
  if(flash>0){g.fillStyle='rgba(255,43,184,'+flash*.35+')';g.fillRect(0,0,W,H)}
  g.restore();
}
function loop(now){
  const dt=Math.min(3,(now-last)/16.67||1);last=now;
  if(state==='play')update(dt);
  draw(now);requestAnimationFrame(loop);
}
function move(e){const r=wrap.getBoundingClientRect();px=(e.clientX-r.left)/r.width*W}
wrap.addEventListener('pointermove',e=>{if(state==='play')move(e)});
wrap.addEventListener('pointerdown',e=>{
  if(state==='play')move(e);
  else if(state==='start'||(state==='over'&&performance.now()-overAt>700))begin();
});
addEventListener('keydown',e=>{keys[e.key]=true;if((e.key===' '||e.key==='Enter')&&state!=='play'&&(state==='start'||performance.now()-overAt>700))begin()});
addEventListener('keyup',e=>{keys[e.key]=false});
requestAnimationFrame(loop);
</script>
</body>
</html>
